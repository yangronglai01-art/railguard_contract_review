name: railguard-petkit-local
services:
  api:
    image: railguard-petkit:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      BUSINESS_PROFILE: petkit
      AUTH_MODE: token
      APP_ENV: local-simulation
      MODEL_PROVIDER: mock
      MODEL_NAME: petkit-rules-v1
      RAG_MODE: mock
      RAG_MOCK_CORPUS_PATH: /app/data/demo/rag-corpus-petkit-v1.json
      DATABASE_PATH: /app/data/runtime/petkit/contracts.db
      CHECKPOINT_PATH: /app/data/runtime/petkit/checkpoints.sqlite3
    volumes:
      - petkit-runtime:/app/data/runtime
    ports:
      - "127.0.0.1::8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    security_opt:
      - no-new-privileges:true
  ui:
    image: railguard-petkit:local
    init: true
    command: [python, -m, streamlit, run, src/railguard/ui/app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false]
    environment:
      RAILGUARD_API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1::8501"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  petkit-runtime:
